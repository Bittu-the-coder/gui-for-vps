<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFV is not running</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #52525b; --accent: #0058c4; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1aa; --accent: #6cb0ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box;
        background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 24rem; }
      p { color: var(--muted); }
      code { color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, transparent); padding: 0.1em 0.4em; border-radius: 6px; }
      button { margin-top: 0.5rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 0.6rem 1.2rem; }
      @media (prefers-color-scheme: dark) { button { color: #0b0b0c; } }
    </style>
  </head>
  <body>
    <main>
      <h1>GFV is not running</h1>
      <p>GFV runs on your own computer. Start it with <code>npx gfv</code>, then open the address it prints.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
