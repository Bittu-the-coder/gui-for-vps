name: Website

# Builds the website (landing page and docs) from site/ and the Markdown guides, and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.mjs'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'COMMERCIAL-LICENSE.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sitemap uses each file's last commit date
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the website
        run: pnpm site:build
        env:
          # Without a custom domain the site lives under /gui-for-vps/. For a custom domain set SITE_URL to it
          # (for example https://gfv.example.com) in the repository variables and the base path becomes empty.
          SITE_URL: ${{ vars.SITE_URL || 'https://bittu-the-coder.github.io/gui-for-vps' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
