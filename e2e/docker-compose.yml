# Two throwaway Ubuntu 24.04 servers (user "gfv", key auth, passwordless sudo).
# First time:  ssh-keygen -t ed25519 -N "" -f e2e/keys/id_test
services:
  vps-a:
    build: { context: ., dockerfile: Dockerfile }
    container_name: gfv-vps-a
    ports: ['127.0.0.1:2201:22']
  vps-b:
    build: { context: ., dockerfile: Dockerfile }
    container_name: gfv-vps-b
    ports: ['127.0.0.1:2202:22']
  # Fedora (dnf). Only started when asked for (it needs the fedora base image, roughly 60 MB plus packages):
  #   docker compose -f e2e/docker-compose.yml --profile fedora up -d --build vps-fedora
  vps-fedora:
    build: { context: ., dockerfile: Dockerfile.fedora }
    container_name: gfv-vps-fedora
    ports: ['127.0.0.1:2203:22']
    profiles: ['fedora']
  # Real systemd + real ufw (M14). Privileged: systemd needs cgroups and the firewall needs netfilter.
  #   docker compose -f e2e/docker-compose.yml --profile systemd up -d --build vps-systemd
  vps-systemd:
    build: { context: ., dockerfile: Dockerfile.systemd }
    container_name: gfv-vps-systemd
    ports: ['127.0.0.1:2204:22']
    privileged: true
    tmpfs: ['/run', '/run/lock']
    # Docker inside this container (M20 App Store) cannot use overlayfs on top of the container's own overlayfs:
    # its storage lives in named volumes, which sit on the host's real filesystem.
    volumes: ['gfv-docker-data:/var/lib/docker', 'gfv-containerd-data:/var/lib/containerd']
    profiles: ['systemd']

volumes:
  gfv-docker-data:
  gfv-containerd-data:
